[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpguard"
version = "1.1.0"
description = "Policy-enforcing security gateway for Model Context Protocol (MCP) servers: tool pinning, argument policy, secret/PII filtering, rate limits, signed audit log, optional OPA policies and an attack simulation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rubbaite T. Hassain" }]
dependencies = []

[project.optional-dependencies]
signing = ["cryptography>=46"]
otel = ["opentelemetry-api>=1.30"]
dev = ["pytest>=9.2.0", "ruff>=0.17.5", "cryptography>=46", "opentelemetry-sdk>=1.45.2"]

[project.scripts]
mcpguard = "mcpguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
